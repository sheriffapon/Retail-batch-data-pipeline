name: Retail Batch Data Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas psycopg2-binary python-dotenv

      - name: Check Python scripts
        run: |
          python -m py_compile scripts/validate_transactions.py
          python -m py_compile scripts/load_transactions.py

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Check dbt project files
        run: |
          test -f dbt/dbt_project.yml
          test -f dbt/profiles/profiles.yml

      - name: CI validation complete
        run: echo "Retail Batch Data Pipeline CI passed"
